# Definición del proyecto para XcodeGen (genera el .xcodeproj en el Mac de GitHub)
name: Desliza
options:
  bundleIdPrefix: com.victor
  deploymentTarget:
    iOS: "17.0"
targets:
  Desliza:
    type: application
    platform: iOS
    sources: [Desliza]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victor.desliza
        PRODUCT_NAME: Desliza
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Desliza
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para revisar tus fotos y borrar las que no quieras."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
