name: Compilar IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Usar el Xcode estable más reciente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sin firmar; Sideloadly la firma luego con tu Apple ID)
        run: |
          xcodebuild -project Desliza.xcodeproj \
            -target Desliza \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Desliza.app Payload/
          zip -qry Desliza.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Desliza-ipa
          path: Desliza.ipa
